name: amplopku
description: Aplikasi pengelolaan keuangan pribadi berbasis metode amplop.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.3

  # Export Excel dan PDF.
  # pdf ditahan di 3.12.x agar kompatibel dengan excel 4.0.6.
  excel: ^4.0.6
  pdf: ^3.12.0
  file_picker: 9.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
